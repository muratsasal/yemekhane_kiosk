name: Build Kiosk APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: YemekNET-Kiosk-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete v1.0.0 --yes || true
        gh release create v1.0.0 app/build/outputs/apk/debug/*.apk --title "YemekNET Kiosk v1.0.0" --notes "General Mobile E-Tab 5 Yemekhane Kiosk APK"