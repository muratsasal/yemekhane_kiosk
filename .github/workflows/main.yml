name: Build Kiosk APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace > build_output.log 2>&1 || {
          echo "BUILD FAILED. Uploading log..."
          tail -n 50 build_output.log
          git config user.name "Actions"
          git config user.email "actions@github.com"
          git add build_output.log
          git commit -m "Auto: build failure log" || true
          git push origin main || true
          exit 1
        }

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: YemekNET-Kiosk-APK
        path: app/build/outputs/apk/debug/*.apk